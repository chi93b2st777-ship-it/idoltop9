openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sync
    description: Cross-device sync operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sync/sessions/{sessionId}:
    get:
      operationId: getSyncSession
      tags: [sync]
      summary: Load a sync session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sync session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertSyncSession
      tags: [sync]
      summary: Save a sync session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncSessionInput"
      responses:
        "200":
          description: Saved sync session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSession"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned storage URL for direct image upload. The client
        sends JSON metadata here, then uploads the file directly to storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded image
      description: Streams an image uploaded through the presigned URL flow.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object directory.
      responses:
        "200":
          description: Image content.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Public random sync code
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{6,64}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SyncCandidate:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        avatar:
          type: string
      required:
        - id
        - name
        - group
        - avatar
    SyncData:
      type: object
      additionalProperties: true
      properties:
        selectedCategoryKey:
          type: string
        currentCandidates:
          type: array
          items:
            $ref: "#/components/schemas/SyncCandidate"
        engineState:
          type: ["object", "null"]
          additionalProperties: true
        sortedResults:
          type: array
          items:
            $ref: "#/components/schemas/SyncCandidate"
        currentView:
          type: string
        timestamp:
          type: integer
      required:
        - selectedCategoryKey
        - currentCandidates
        - engineState
        - sortedResults
        - currentView
        - timestamp
    SyncSessionInput:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SyncData"
      required:
        - data
    SyncSession:
      type: object
      properties:
        sessionId:
          type: string
        data:
          $ref: "#/components/schemas/SyncData"
        updatedAt:
          type: string
          format: date-time
      required:
        - sessionId
        - data
        - updatedAt
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned storage URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path to store in sync data.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

